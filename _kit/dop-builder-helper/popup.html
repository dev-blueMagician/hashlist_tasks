<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DOP Builder Helper</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 300px; margin: 12px; color: #1d1d1f; background: #fff; }
  body.wide { width: 440px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { font: inherit; padding: 4px 10px; margin: 0 6px 0 0; }
  .link { border: 0; background: none; padding: 0; margin: 0 0 0 4px; color: #0b57d0; cursor: pointer; text-decoration: underline; }
  .hint { color: #555; margin: 6px 0; }
  #toggle { margin-top: 6px; }
  textarea { width: 100%; box-sizing: border-box; height: 110px; font: 12px/1.3 Consolas, monospace; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f4f4f5; padding: 6px; max-height: 260px; overflow: auto; margin: 8px 0 0; }
  pre:empty { display: none; }
</style>
</head>
<body>
<h1>DOP Builder Helper</h1>
<button id="save">Save page</button><button id="choose">Choose folder</button>
<p class="hint">Saves to: <b id="dest">Downloads</b><button id="reset" class="link" hidden>use Downloads</button></p>
<button id="toggle" aria-expanded="false">Fill 5.4 steps ▸</button>
<div id="steps" hidden>
  <p class="hint">Paste the steps file, press Preview, then Fill. Keep this box open until it finishes.</p>
  <textarea id="spec" spellcheck="false" placeholder='{"steps": [{"text": "...", "field": "card_io_ok", "low": 1, "high": 1, "worth": 1, "wrong": ["naive_a"]}]}'></textarea>
  <div><button id="preview">Preview</button><button id="fill">Fill</button></div>
</div>
<pre id="out"></pre>
<script src="store.js"></script>
<script src="popup.js"></script>
</body>
</html>
